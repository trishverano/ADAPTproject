<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Coastal Weather & Heat Information Portal - Sablayan
  </title>

  <!-- OpenLayers -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.css"
  >

  <!-- Shared CSS -->
  <link
    rel="stylesheet"
    href="../../shared/css/styles.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.js">
  </script>

</head>


<body>

  <!-- ======================================================
       HEADER
       ====================================================== -->

  <header class="topbar">

    <div class="brand-left">

      <h1>
        Coastal Weather & Heat Information Portal
      </h1>

      <p>
        Sablayan, Occidental Mindoro
      </p>

    </div>


    <div class="logo-row">

      <img
        src="../../shared/assets/img/logos/sablayan_logo.jfif"
        alt="Municipality of Sablayan"
        class="logo"
      >

      <img
        src="../../shared/assets/img/logos/ADAPT_Document_Banner.png"
        alt="ADAPT Project"
        class="logo banner-logo"
      >

      <img
        src="../../shared/assets/img/logos/ADHIKA.png"
        alt="ADHIKA"
        class="logo"
      >

    </div>

  </header>


  <!-- ======================================================
       MAIN PAGE
       ====================================================== -->

  <div class="page">


    <!-- ====================================================
         SIDEBAR
         ==================================================== -->

    <aside class="sidebar">


      <!-- COASTAL MAP DATA -->

      <div class="panel-card">

        <h3>
          Coastal Map Layers
        </h3>

        <!--
          app.js automatically creates
          Sablayan's available layer switches here.
        -->

        <div id="layerControls"></div>

      </div>


      <!-- BASEMAP -->

      <div class="panel-card">

        <h3>
          Basemap
        </h3>

        <select
          id="basemapSelect"
          class="widget-select"
        >

          <option
            value="osm"
            selected
          >
            OpenStreetMap
          </option>

          <option value="topo">
            Topographic
          </option>

          <option value="satellite">
            Satellite
          </option>

        </select>

      </div>


      <!-- CURRENT WEATHER -->

      <div class="panel-card">

        <h3>
          Current Weather
        </h3>

        <div
          id="weatherBox"
          class="widget-box"
        >
          Loading weather...
        </div>

      </div>


      <!-- EXPORT -->

      <div class="panel-card">

        <h3>
          Export Map
        </h3>

        <button
          id="exportMapBtn"
          class="action-btn"
        >
          Export as JPEG
        </button>

      </div>


      <!-- COASTAL GIS LEGEND -->

      <div class="panel-card">

        <h3>
          Coastal Map Legend
        </h3>

        <div
          id="legendBox"
          class="legend-list"
        >
          Loading legend...
        </div>

      </div>

    </aside>


    <!-- ====================================================
         MAP
         ==================================================== -->

    <main class="map-wrap">

      <button
        id="menuBtn"
        class="mobile-menu-btn"
        aria-label="Open map tools"
      >
        ☰
      </button>

      <div id="map"></div>

      <div
        id="popup"
        class="map-popup"
        style="display:none;"
      >
      </div>

    </main>

  </div>


  <!-- ======================================================
       SABLAYAN CONFIG
       ====================================================== -->

  <script src="config.js"></script>


  <!-- ======================================================
       SHARED APPLICATION
       ====================================================== -->

  <script src="../../shared/js/app.js"></script>

  <script src="../../shared/js/weather.js"></script>


</body>

</html>
